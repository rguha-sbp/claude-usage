name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The tool targets macOS (launchd, terminal-notifier, the system python3).
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the macOS system python3 the statusline runs on; 3.13 is current.
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Python tests and the node office checks
        run: uv run --locked --python ${{ matrix.python }} pytest -q
