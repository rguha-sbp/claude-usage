name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The tool targets macOS (launchd, terminal-notifier).
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python is >=3.15 and install.sh pins the statusline to a
        # 3.15 interpreter, so 3.15 is the only version worth testing.
        python: ["3.15"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Python tests and the node office checks
        run: uv run --locked --python ${{ matrix.python }} pytest -q
